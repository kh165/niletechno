<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="100%" height="100%">
  <defs>
    <!-- Yellow Droplet Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b" />
      <stop offset="60%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </linearGradient>
    
    <!-- Red Swoosh Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Blue Wing Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background is transparent -->
  <rect width="400" height="380" fill="transparent" />

  <g transform="translate(0, 10)">
    <!-- 1. Left/Bottom Red Swoosh Crescent -->
    <path 
      d="M 75 90 C 65 140 85 205 155 240 C 205 265 260 255 295 230 C 270 240 215 245 165 225 C 105 195 85 140 92 98 Z" 
      fill="url(#redGrad)" 
    />
    <path 
      d="M 75 90 C 60 145 80 215 155 248 C 215 272 275 258 310 226 C 265 248 205 250 152 230 C 92 198 75 142 85 92 Z" 
      fill="url(#redGrad)" 
    />

    <!-- 2. Blue Dynamic Wing Blade 1 (Left Wing) -->
    <path 
      d="M 112 50 C 130 90 145 145 190 190 C 160 178 135 145 125 105 C 120 85 115 65 112 50 Z" 
      fill="url(#blueGrad)" 
    />
    <path 
      d="M 114 48 C 132 92 148 148 200 196 C 172 184 142 152 130 110 C 124 88 118 68 114 48 Z" 
      fill="url(#blueGrad)" 
    />

    <!-- 3. Blue Dynamic Wing Blade 2 (Center Wing) -->
    <path 
      d="M 162 48 C 178 92 196 150 252 198 C 218 186 186 154 175 112 C 168 90 164 68 162 48 Z" 
      fill="url(#blueGrad)" 
    />

    <!-- 4. Yellow Oil / Liquid Drop -->
    <path 
      d="M 265 4 C 265 4 308 90 308 122 C 308 152 288 172 262 172 C 235 172 215 152 215 122 C 215 90 265 4 265 4 Z" 
      fill="url(#dropGrad)" 
    />

    <!-- Specular Highlight on Yellow Drop -->
    <path 
      d="M 245 80 C 238 95 235 110 238 125 C 236 115 238 100 245 88 C 248 83 252 78 255 75 C 249 76 246 78 245 80 Z" 
      fill="#ffffff" 
      opacity="0.85" 
    />
    <ellipse cx="242" cy="110" rx="8" ry="16" transform="rotate(-15 242 110)" fill="#ffffff" opacity="0.65" />

    <!-- 5. Right Red Accent Wing -->
    <path 
      d="M 310 32 C 335 75 350 130 330 185 C 315 218 290 240 280 246 C 305 235 330 205 342 170 C 356 128 340 70 310 32 Z" 
      fill="url(#redGrad)" 
    />

    <!-- 6. Arabic Brand Typography: "المصرية الماليزية" in Bold Red -->
    <text 
      x="200" 
      y="305" 
      font-family="'Cairo', 'Tajawal', Arial, sans-serif" 
      font-size="37" 
      font-weight="900" 
      fill="#c5221f" 
      text-anchor="middle"
      letter-spacing="-0.5"
    >
      المصرية الماليزية
    </text>

    <!-- 7. Arabic Sub-typography: "ش . م . م" in Royal Blue -->
    <text 
      x="200" 
      y="350" 
      font-family="'Cairo', 'Tajawal', Arial, sans-serif" 
      font-size="32" 
      font-weight="900" 
      fill="#1d4ed8" 
      text-anchor="middle"
      letter-spacing="4"
    >
      ش . م . م
    </text>
  </g>
</svg>
